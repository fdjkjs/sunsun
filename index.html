  :root{--head:"ModestoExp","Helvetica Neue",Arial,sans-serif;--body:"PerpetuaMenu","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif}
  :root{
    --ink:#1c1a18; --paper:#faf8f4; --line:#8a847b; --accent:#b4432b; --ok:#2f7d5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#e9e5de;color:var(--ink);
    font-family:var(--body);font-synthesis:none}
  body{margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));min-height:100vh}
  .sheet{flex:none;width:100%;max-width:900px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink);
    padding:4px 12px}
  #menu{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:6px 4px 8px}
  .grp{display:block}
  .col{display:flex;flex-direction:column;gap:10px}
  .grp .items{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 9px;padding-top:8px}
  h2{margin:0;text-align:center;font-family:var(--head);font-weight:400;letter-spacing:.14em;font-size:13px;color:var(--ink);padding-bottom:5px;border-bottom:1.5px dotted var(--line)}
  .item{position:relative;min-width:0;padding:8px 14px;border:1px solid #cfc9bf;border-radius:10px;
    background:#fff;font:inherit;font-size:18px;color:inherit;cursor:pointer;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s,background .15s,border-color .15s}
  .item:active{transform:scale(.95)}
  .item.on{border-color:var(--accent);background:#fdf1ed}
  .badge{position:absolute;top:-9px;right:-7px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;
    background:var(--accent);color:#fff;font:700 14px/26px "Helvetica Neue",Arial,sans-serif;text-align:center;display:none}
  .item.on .badge{display:block}
  .alt{font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif!important}
  .item.alt{font-size:17px}
  .card li span.alt{font-size:16.5px}
  .hint{text-align:center;font-size:12px;color:#7a746b;margin:16px 0 0;line-height:1.6}

  .orders{width:100%;max-width:900px;margin:10px auto 0}
  .orders h3{font-family:var(--head);font-weight:400;letter-spacing:.12em;font-size:15px;margin:0 4px 8px;flex:none;
    display:flex;justify-content:space-between;align-items:baseline}
  .orders h3 small{font-weight:400;letter-spacing:0;color:#7a746b;font-size:12px}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-content:start;grid-auto-rows:max-content;padding-bottom:84px}
  .empty{grid-column:1/-1;text-align:center;color:#8a847b;font-size:14px;padding:26px 0;border:1.5px dashed #c2bcb1;border-radius:12px}
  .swipe{position:relative;align-self:start;min-height:min-content;border-radius:12px;overflow:hidden;background:transparent}
  .swipe.drag{background:var(--ok)}
  .swipe::before,.swipe::after{content:"提供済み ✓";position:absolute;top:50%;transform:translateY(-50%);
    color:#fff;font:700 14px "Helvetica Neue",Arial,sans-serif}
  .swipe:not(.drag)::before,.swipe:not(.drag)::after{display:none}
  .swipe::before{left:18px}.swipe::after{right:18px}
  .card{position:relative;background:#fff;border:1px solid #d7d1c6;border-radius:12px;padding:12px 14px;
    touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
  .card.snap{transition:transform .22s ease,opacity .22s ease}
  .card .top{display:flex;justify-content:space-between;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:#7a746b;margin-bottom:6px}
  .card .top b{color:var(--ink);font-size:14px}
  .card ul{list-style:none;margin:0;padding:0}
  .card li{display:flex;justify-content:space-between;font-size:18px;padding:2px 0}
  .card li span:last-child{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700}

  .fab{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:10px;padding:16px 22px;border:0;border-radius:32px;background:var(--ink);color:#fff;
    font:700 16px "Helvetica Neue",Arial,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;
    transition:transform .1s,opacity .2s,background .2s}
  .fab:active{transform:scale(.96)}
  .fab[disabled]{opacity:.35;cursor:default}
  .fab:not([disabled]){background:var(--accent)}
  .fab .n{background:#fff;color:var(--accent);border-radius:12px;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;padding:0 6px}
  .fab[disabled] .n{color:var(--ink)}
  .clear{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));
    border:1px solid #b9b2a6;background:rgba(250,248,244,.95);color:#5b554d;border-radius:20px;padding:10px 16px;
    font:600 13px "Helvetica Neue",Arial,sans-serif;display:none}
  .clear.show{display:block}
  .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font:600 14px "Helvetica Neue",Arial,sans-serif;
    opacity:0;pointer-events:none;transition:all .25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="sheet">
  <div id="menu"></div>
</main>

<section class="orders">
  <h3><span>注文リスト <small id="count"></small></span><small>数字バッジで1つ減 ・ カードを左右スワイプで提供済み</small></h3>
  <div id="list"></div>
</section>

<button class="clear" id="clear">選択をクリア</button>
<button class="fab" id="order" disabled>注文する <span class="n" id="total">0</span></button>
<div class="toast" id="toast"></div>

<script>
const MENU = [
  ["BEER", ["HEARTLAND", "Ginger Beer"]],
  ["WINE", ["White Wine", "Red Wine"]],
  ["HIGH BALL", ["Highball", "Ginger Highball"]],
  ["COCKTAIL", ["Lemon Sour","Gin Tonic","Vodka Soda","Rum Coke","Cassis Orange","Bulldog","Shochu & Oolong","Peach Oolong"]],
  ["SOFT DRINK", ["Orange Juice","Grapefruit Juice","Oolong Tea","Ginger Ale","Coke","IC","IST","HC"]],
];
// Perpetua(PDF埋め込み)に無い文字を含む品名は代替の明朝系フォントで表示
const HAVE = "&ABCDEGHJLNOPRSTVWabcdefghiklmnoprstu";
const alt = n => [...n].some(c => /[A-Za-z]/.test(c) && !HAVE.includes(c)) ? " alt" : "";
const KEY = "freedrink-orders-v1";
let cart = {};      // name -> count
let orders = [];    // {id, time, items:[[name,count]]}
let seq = 1;

try{
  const s = JSON.parse(localStorage.getItem(KEY) || "null");
  if(s){ orders = s.orders || []; seq = s.seq || 1; }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({orders, seq})); }catch(e){} }

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- menu ----
const menuEl = $("menu");
const grpHTML = ([cat, items]) => `<div class="grp"><h2>${cat}</h2><div class="items">` +
  items.map(n => `<button class="item${alt(n)}" data-name="${esc(n)}">${esc(n)}<span class="badge"></span></button>`).join("") +
  `</div></div>`;
// 2列に振り分け: 左=BEER/COCKTAIL 右=WINE/HIGH BALL/SOFT DRINK
const byName = Object.fromEntries(MENU);
const COLS = [["BEER","COCKTAIL"],["WINE","HIGH BALL","SOFT DRINK"]];
menuEl.innerHTML = COLS.map(c => `<div class="col">${c.map(k => grpHTML([k, byName[k]])).join("")}</div>`).join("");

menuEl.addEventListener("click", e => {
  const btn = e.target.closest(".item"); if(!btn) return;
  const n = btn.dataset.name;
  if(e.target.classList.contains("badge")){            // badge tap = minus
    cart[n] = Math.max(0, (cart[n]||0) - 1);
    if(!cart[n]) delete cart[n];
  } else {
    cart[n] = (cart[n]||0) + 1;
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(_){}
  }
  renderCart();
});

function renderCart(){
  let total = 0;
  document.querySelectorAll(".item").forEach(b => {
    const c = cart[b.dataset.name] || 0; total += c;
    b.classList.toggle("on", c > 0);
    b.querySelector(".badge").textContent = c;
  });
  $("total").textContent = total;
  $("order").disabled = total === 0;
  $("clear").classList.toggle("show", total > 0);
}

$("clear").onclick = () => { cart = {}; renderCart(); };

$("order").onclick = () => {
  const items = Object.entries(cart);
  if(!items.length) return;
  const d = new Date();
  orders.push({id: seq++, time: d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"), items});
  cart = {}; save(); renderCart(); renderOrders();
  toast("注文しました");
  setTimeout(() => $("list").lastElementChild && $("list").lastElementChild.scrollIntoView({behavior:"smooth", block:"nearest"}), 50);
};

// ---- orders + swipe ----
function renderOrders(){
  const list = $("list");
  $("count").textContent = orders.length ? `${orders.length}件` : "";
  if(!orders.length){ list.innerHTML = `<div class="empty">まだ注文はありません</div>`; return; }
  list.innerHTML = orders.map(o => {
    const sum = o.items.reduce((a,[,c]) => a + c, 0);
    return `<div class="swipe" data-id="${o.id}"><div class="card">
      <div class="top"><b>#${o.id}</b><span>${o.time} ・ ${sum}杯</span></div>
      <ul>${o.items.map(([n,c]) => `<li><span class="${alt(n).trim()}">${esc(n)}</span><span>× ${c}</span></li>`).join("")}</ul>
    </div></div>`;
  }).join("");
  list.querySelectorAll(".swipe").forEach(attachSwipe);
}

function attachSwipe(wrap){
  const card = wrap.querySelector(".card");
  let sx = 0, sy = 0, dx = 0, active = false, locked = false;
  card.addEventListener("pointerdown", e => {
    active = true; locked = false; sx = e.clientX; sy = e.clientY; dx = 0;
    card.classList.remove("snap");
  });
  card.addEventListener("pointermove", e => {
    if(!active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if(!locked && Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)){
      locked = true; wrap.classList.add("drag"); try{ card.setPointerCapture(e.pointerId); }catch(_){}
    }
    if(locked){ dx = mx; card.style.transform = `translateX(${dx}px)`; }
  });
  const end = () => {
    if(!active) return; active = false;
    card.classList.add("snap");
    if(Math.abs(dx) > wrap.offsetWidth * 0.35){
      card.style.transform = `translateX(${dx > 0 ? "110%" : "-110%"})`;
      card.style.opacity = "0";
      setTimeout(() => {
        orders = orders.filter(o => o.id !== +wrap.dataset.id);
        save(); renderOrders();
      }, 220);
    } else {
      card.style.transform = "";
      setTimeout(() => wrap.classList.remove("drag"), 230);
    }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

let tt;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1400);
}

renderCart(); renderOrders();
</script>
</body>
</html>
